[package]
name = "fiscalclock-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Karthik-beta/fiscalclock"
description = "WebAssembly module for the fiscalclock npm package"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
fiscalclock = { path = "../../crates/core", version = "=0.1.0" }
# Exact, because wasm-bindgen-cli must be the same version.
wasm-bindgen = "=0.2.129"
