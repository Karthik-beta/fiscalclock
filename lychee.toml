# Link checking for every Markdown file in the repository.
max_retries = 3
timeout = 30
accept = ["200..=299", "429"]
user_agent = "Mozilla/5.0 (compatible; fiscalclock-linkcheck; +https://github.com/Karthik-beta/fiscalclock)"
exclude_path = ["target", "node_modules", "bindings/js/pkg", ".venv"]

exclude = [
  # Placeholders in templates, not real links.
  '^https://github\.com/Karthik-beta/fiscalclock/issues/new\?template=',
  '^https://github\.com/Karthik-beta/fiscalclock/security/advisories/new$',
  # npmjs.com answers automated requests with 403 even for packages that exist.
  '^https://www\.npmjs\.com/',
  # sec.gov refuses requests without a contact email in the User-Agent, and
  # packages.ecosyste.ms answers link checkers with 402; both pages exist.
  '^https://(www\.)?sec\.gov/',
  '^https://packages\.ecosyste\.ms/',
]
