<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fiscalclock brand directions</title>
<!-- Phase 3 exploration. Sketches for choosing a direction; nothing here is final artwork. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&family=Source+Code+Pro:wght@400;500&family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/commit-mono@5.2.5/index.css" rel="stylesheet">
<style>
  /* Page chrome: deliberately plain so it does not favour any direction. */
  :root { --page-bg: #f6f6f6; --page-ink: #1b1b1b; --page-muted: #5c5c5c; --page-rule: #d6d6d6; }
  :root[data-theme="dark"] { --page-bg: #0e0e0e; --page-ink: #e8e8e8; --page-muted: #a2a2a2; --page-rule: #2c2c2c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page-bg); color: var(--page-ink); font: 15px/1.55 system-ui, sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 80px; }
  .pagehead { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--page-rule); padding-bottom: 16px; }
  .pagehead h1 { font-size: 20px; margin: 0; }
  .pagehead p { margin: 4px 0 0; color: var(--page-muted); max-width: 70ch; }
  .switch { display: inline-flex; border: 1px solid var(--page-rule); border-radius: 6px; overflow: hidden; }
  .switch button { font: inherit; background: none; color: inherit; border: 0; padding: 6px 14px; cursor: pointer; min-height: 32px; }
  .switch button[aria-pressed="true"] { background: var(--page-ink); color: var(--page-bg); }
  .switch button:focus-visible { outline: 2px solid var(--page-ink); outline-offset: 2px; }

  /* Direction themes. Values are the candidate palettes checked in palettes.py. */
  .A { --sans: "Source Sans 3", sans-serif; --head: "Source Serif 4", serif; --mono: "Source Code Pro", monospace; --head-weight: 600; --head-track: -0.01em; --radius: 2px; }
  .B { --sans: "IBM Plex Sans", sans-serif; --head: "IBM Plex Sans", sans-serif; --mono: "IBM Plex Mono", monospace; --head-weight: 600; --head-track: -0.01em; --radius: 3px; }
  .C { --sans: "Inter", sans-serif; --head: "Inter", sans-serif; --mono: "Commit Mono", monospace; --head-weight: 600; --head-track: -0.025em; --radius: 6px; }
  .A.light { --bg:#F7F9F8; --surface:#EDF1EF; --text:#14201B; --text2:#46534D; --rule:#CFD8D3; --control:#7E8A84; --accent:#1D5C3F; --fill-a:#E2EAE5; --fill-b:#F1F5F3; --hatch:#1D5C3F; }
  .A.dark  { --bg:#101614; --surface:#17201C; --text:#E3EAE6; --text2:#A2AFA9; --rule:#2B3631; --control:#6E7B75; --accent:#7FC8A3; --fill-a:#1E2A25; --fill-b:#151D1A; --hatch:#7FC8A3; }
  .B.light { --bg:#FFFFFF; --surface:#F4F5F7; --text:#14171C; --text2:#4A515D; --rule:#D8DCE2; --control:#7A818C; --accent:#1F4C86; --fill-a:#E3E8F0; --fill-b:#F3F5F8; --hatch:#1F4C86; }
  .B.dark  { --bg:#101216; --surface:#171A20; --text:#E5E8EC; --text2:#A0A7B2; --rule:#2A2F38; --control:#6F7783; --accent:#8EB4EE; --fill-a:#1F2532; --fill-b:#171B23; --hatch:#8EB4EE; }
  .C.light { --bg:#FDFDFC; --surface:#F2F2F0; --text:#191918; --text2:#555552; --rule:#DDDDD9; --control:#7D7D79; --accent:#0B6B69; --fill-a:#E9E9E6; --fill-b:#F5F5F3; --hatch:#0B6B69; }
  .C.dark  { --bg:#121212; --surface:#1A1A19; --text:#ECECEA; --text2:#A5A5A1; --rule:#2D2D2B; --control:#71716D; --accent:#5CC6BE; --fill-a:#252524; --fill-b:#1C1C1B; --hatch:#5CC6BE; }
  .themed { background: var(--bg); color: var(--text); font-family: var(--sans); }

  section.dir { margin-top: 48px; }
  .dirhead { display: grid; gap: 4px; margin-bottom: 16px; }
  .dirhead h2 { margin: 0; font-size: 26px; }
  .dirhead .concept { margin: 0; color: var(--page-muted); max-width: 78ch; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); }
  .card { border: 1px solid var(--page-rule); border-radius: 8px; overflow: hidden; }
  .card > h3 { margin: 0; padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--page-muted); border-bottom: 1px solid var(--page-rule); background: var(--page-bg); }
  .span-12 { grid-column: span 12; } .span-7 { grid-column: span 7; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; }
  @media (max-width: 900px) { .span-7, .span-5, .span-6 { grid-column: span 12; } }

  /* Logo panel */
  .logos { display: grid; grid-template-columns: 1fr 1fr; }
  .logos > div { padding: 24px 20px; display: grid; gap: 18px; align-content: start; }
  .sizes { display: flex; gap: 18px; align-items: end; }
  .sizes figure { margin: 0; display: grid; gap: 4px; justify-items: center; font: 11px/1.2 system-ui, sans-serif; color: var(--text2); }
  .lockup { display: flex; align-items: center; gap: 12px; }
  .wordmark { font-family: var(--head); font-weight: var(--head-weight); letter-spacing: var(--head-track); font-size: 30px; line-height: 1; }
  .C .wordmark { letter-spacing: -0.035em; }

  /* Palette panel */
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0; }
  .swatch { padding: 10px 12px; min-height: 76px; display: grid; align-content: space-between; font: 12px/1.35 system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .swatch b { font-weight: 600; }
  table.ratios { width: 100%; border-collapse: collapse; font: 12px/1.4 system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  table.ratios th, table.ratios td { text-align: left; padding: 4px 12px; border-top: 1px solid var(--page-rule); }
  table.ratios td.num { text-align: right; }

  /* Type panel */
  .type { padding: 20px; display: grid; gap: 12px; }
  .type .h { font-family: var(--head); font-weight: var(--head-weight); letter-spacing: var(--head-track); font-size: 34px; line-height: 1.15; margin: 0; }
  .type p { margin: 0; max-width: 62ch; font-size: 16px; line-height: 1.6; }
  .type code, .mono { font-family: var(--mono); font-size: 0.92em; }
  .nums { font-variant-numeric: tabular-nums lining-nums; }
  .datecol { font-family: var(--sans); font-variant-numeric: tabular-nums; display: grid; grid-template-columns: auto auto auto; gap: 2px 20px; justify-content: start; font-size: 15px; }
  .datecol span:nth-child(3n+1) { color: var(--text2); }

  /* README mock */
  .readme { padding: 28px 28px 24px; display: grid; gap: 14px; }
  .readme .desc { font-size: 17px; margin: 0; max-width: 60ch; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .badge { font: 11px/1 system-ui, sans-serif; border-radius: 3px; overflow: hidden; display: inline-flex; }
  .badge span { padding: 4px 6px; } .badge span:first-child { background: #555; color: #fff; } .badge span:last-child { background: #3f7a34; color: #fff; }
  .proof { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 14px; color: var(--text2); font-variant-numeric: tabular-nums; border-top: 1px solid var(--rule); padding-top: 12px; }
  .proof strong { color: var(--text); font-weight: 600; }

  /* Docs mock */
  .docs { display: grid; grid-template-columns: 170px 1fr; min-height: 420px; font-size: 14px; }
  .docs nav { border-right: 1px solid var(--rule); padding: 16px 12px; display: grid; gap: 2px; align-content: start; background: var(--surface); }
  .docs nav a { color: var(--text2); text-decoration: none; padding: 4px 8px; border-radius: var(--radius); }
  .docs nav a.on { color: var(--text); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); border-radius: 0; }
  .docs main { padding: 20px 24px; display: grid; gap: 12px; align-content: start; min-width: 0; }
  .docs h4 { font-family: var(--head); font-weight: var(--head-weight); letter-spacing: var(--head-track); font-size: 26px; margin: 0; }
  .docs p { margin: 0; max-width: 64ch; line-height: 1.6; }
  .docs a.link { color: var(--accent); text-underline-offset: 2px; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); }
  .tabs span { padding: 6px 10px; color: var(--text2); font-size: 13px; }
  .tabs span.on { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
  pre.code { margin: 0; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px; font: 12.5px/1.6 var(--mono); overflow-x: auto; }
  pre.code .k { color: var(--accent); } pre.code .c { color: var(--text2); }
  table.res { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; width: 100%; }
  table.res th { text-align: left; font-weight: 600; color: var(--text2); border-bottom: 1px solid var(--control); padding: 6px 10px 6px 0; }
  table.res td { border-bottom: 1px solid var(--rule); padding: 6px 10px 6px 0; }
  .A table.res tr.total td { border-bottom: 3px double var(--text); }
  .note { border: 1px solid var(--rule); border-left: 3px solid var(--text2); padding: 8px 12px; font-size: 13px; color: var(--text2); border-radius: var(--radius); }

  /* Social card mock: 1200 x 630 drawn at half size */
  .socialwrap { padding: 16px; background: var(--page-bg); }
  .social { width: 100%; max-width: 600px; aspect-ratio: 1200 / 630; position: relative; overflow: hidden; border: 1px solid var(--page-rule); }
  .social .inner { position: absolute; inset: 0; padding: 7% 7.5%; display: grid; grid-template-rows: auto 1fr auto; }
  .social .tag { font-size: clamp(14px, 3vw, 22px); line-height: 1.3; max-width: 22ch; margin: 0; font-family: var(--head); font-weight: var(--head-weight); letter-spacing: var(--head-track); }
  .social .foot { font-size: 12px; color: var(--text2); font-variant-numeric: tabular-nums; }

  /* Diagram panel */
  .diagram { padding: 16px 20px 12px; }
  .diagram figcaption { font-size: 12px; color: var(--text2); margin-top: 8px; }
  .diagram svg { width: 100%; height: auto; display: block; }

  .verdict { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .verdict div { border: 1px solid var(--page-rule); border-radius: 8px; padding: 12px 16px; }
  .verdict h3 { margin: 0 0 6px; font-size: 14px; }
  .verdict ul { margin: 0; padding-left: 18px; color: var(--page-muted); }
  @media (max-width: 700px) { .verdict, .logos { grid-template-columns: 1fr; } .docs { grid-template-columns: 1fr; } .docs nav { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="pagehead">
    <div>
      <h1>fiscalclock: three brand directions</h1>
      <p>Phase 3 sketches for choosing a direction. Logos are concept drawings, not final artwork; every colour pair shown passes WCAG 2.2 AA in both themes. Example dates are NRF 4-5-4 fiscal 2023, an illustrative definition, not a built-in.</p>
    </div>
    <div class="switch" role="group" aria-label="Theme for the mock-ups">
      <button type="button" data-set="light" aria-pressed="true">Light</button>
      <button type="button" data-set="dark" aria-pressed="false">Dark</button>
    </div>
  </header>
  <div id="dirs"></div>
</div>

<script>
const DIRS = [
  {
    id: "A", name: "A. Ledger",
    concept: "fiscalclock as the accountant's working paper: serif headings, ruled columns, and the double rule that accountants draw under a figure once it is final and checked. Calm, classic, unmistakably about money and periods.",
    palette: {
      light: [["bg","#F7F9F8"],["surface","#EDF1EF"],["text","#14201B"],["text-2","#46534D"],["rule","#CFD8D3"],["accent (ledger green)","#1D5C3F"]],
      dark:  [["bg","#101614"],["surface","#17201C"],["text","#E3EAE6"],["text-2","#A2AFA9"],["rule","#2B3631"],["accent","#7FC8A3"]]
    },
    ratios: [["text on bg","15.86","14.97"],["text-2 on bg","7.62","8.05"],["accent on bg","7.48","9.32"],["accent on surface","6.94","8.48"],["control border on bg","3.39","4.14"]],
    social: "A fiscal year, worked out to the day.",
    pros: ["Speaks to finance and analytics readers at once", "Double rule is a real accounting convention, not decoration", "All three Source faces have tabular figures by default"],
    cons: ["Serif plus hairlines drifts towards the 'broadsheet' look that generated sites overuse", "Green can read as 'profit' or 'success'", "The double rule is thin at 16 px; the favicon needs its own drawing"]
  },
  {
    id: "B", name: "B. Period grid",
    concept: "fiscalclock as an exact instrument: the mark is a quarter drawn as weeks in a 4-5-4 pattern, the one cell that breaks the rectangle is the week other tools get wrong, and the library's own diagrams carry the identity. Technical, engineered, quiet.",
    palette: {
      light: [["bg","#FFFFFF"],["surface","#F4F5F7"],["text","#14171C"],["text-2","#4A515D"],["rule","#D8DCE2"],["accent (ink blue)","#1F4C86"]],
      dark:  [["bg","#101216"],["surface","#171A20"],["text","#E5E8EC"],["text-2","#A0A7B2"],["rule","#2A2F38"],["accent","#8EB4EE"]]
    },
    ratios: [["text on bg","17.96","15.25"],["text-2 on bg","7.99","7.73"],["accent on bg","8.61","8.85"],["accent on surface","7.90","8.22"],["control border on bg","3.92","4.14"]],
    social: "Fiscal years, quarters, periods and weeks from one JSON definition.",
    pros: ["The mark is the library's subject: a 4-5-4 quarter and an extra week", "IBM Plex figures are tabular by default; I, l and 1 are clearly different", "Diagrams double as brand imagery, so the site needs no illustration"],
    cons: ["Plex carries an IBM association", "Blue is the most common colour for developer tools", "At 16 px the grid collapses to three bars, a simpler but less specific shape"]
  },
  {
    id: "C", name: "C. Interval",
    concept: "fiscalclock as notation: the mark is [ ), the half-open interval every period is built from, with the open end in the accent colour because the excluded end is the detail that matters. Minimal, modern, nearly monochrome; typography does the work.",
    palette: {
      light: [["bg","#FDFDFC"],["surface","#F2F2F0"],["text","#191918"],["text-2","#555552"],["rule","#DDDDD9"],["accent (deep teal)","#0B6B69"]],
      dark:  [["bg","#121212"],["surface","#1A1A19"],["text","#ECECEA"],["text-2","#A5A5A1"],["rule","#2D2D2B"],["accent","#5CC6BE"]]
    },
    ratios: [["text on bg","17.28","15.83"],["text-2 on bg","7.34","7.57"],["accent on bg","6.21","9.16"],["accent on surface","5.64","8.52"],["control border on bg","4.06","3.82"]],
    social: "[start, end) for every fiscal period.",
    pros: ["Closest to the sites you admire (Linear, Vercel, Resend)", "The mark is plain type, so it stays sharp at 16 px and in one colour", "Teaches the library's key rule, end_exclusive, at a glance"],
    cons: ["Inter is used so widely that it reads as a default", "Brackets are common in developer logos, so [ ) must be drawn with care to stand apart", "Least warm for finance readers"]
  }
];

// Concept marks. Colours come from the theme: ink for structure, accent for the one meaningful part.
function mark(id, size, ink, accent, small) {
  const s = size;
  if (id === "A") {
    return small
      ? `<svg width="${s}" height="${s}" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="14" height="8" fill="${ink}"/><rect x="1" y="11" width="14" height="2" fill="${accent}"/><rect x="1" y="14" width="14" height="2" fill="${accent}"/></svg>`
      : `<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="6" width="48" height="32" fill="${ink}"/><rect x="8" y="45" width="48" height="5" fill="${accent}"/><rect x="8" y="55" width="48" height="5" fill="${accent}"/></svg>`;
  }
  if (id === "B") {
    if (small) {
      return `<svg width="${s}" height="${s}" viewBox="0 0 16 16" aria-hidden="true"><rect x="0" y="1" width="11" height="4" fill="${ink}"/><rect x="0" y="6" width="11" height="4" fill="${ink}"/><rect x="12" y="6" width="4" height="4" fill="${accent}"/><rect x="0" y="11" width="11" height="4" fill="${ink}"/></svg>`;
    }
    const cell = 10, gap = 3, x0 = 1, y0 = 14; let r = "";
    [4, 5, 4].forEach((n, row) => {
      for (let i = 0; i < n; i++) {
        const fill = (row === 1 && i === 4) ? accent : ink;
        r += `<rect x="${x0 + i * (cell + gap)}" y="${y0 + row * (cell + gap)}" width="${cell}" height="${cell}" rx="1" fill="${fill}"/>`;
      }
    });
    return `<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true">${r}</svg>`;
  }
  return small
    ? `<svg width="${s}" height="${s}" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 1H7V3H4.2V13H7V15H2Z" fill="${ink}"/><path d="M9.4 1.4C13.4 4.2 13.4 11.8 9.4 14.6" fill="none" stroke="${accent}" stroke-width="2.2"/></svg>`
    : `<svg width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true"><path d="M10 6H28V14H19V50H28V58H10Z" fill="${ink}"/><path d="M38 8C55 20 55 44 38 56" fill="none" stroke="${accent}" stroke-width="8.5"/></svg>`;
}

function vars(id, theme) {
  const el = document.createElement("div");
  el.className = `${id} ${theme}`; document.body.appendChild(el);
  const cs = getComputedStyle(el); const v = n => cs.getPropertyValue(n).trim();
  const out = { text: v("--text"), accent: v("--accent"), bg: v("--bg"), text2: v("--text2") };
  el.remove(); return out;
}

// Year strip: NRF 4-5-4 fiscal 2023, 53 weeks, extra week in period 12. Widths proportional to weeks (7 days each).
const WEEKS = [4,5,4,4,5,4,4,5,4,4,5,5];
function yearStrip(id) {
  const W = 742, x0 = 0, unit = W / 53, H = 132; let s = "", acc = 0;
  const qStarts = [0, 13, 26, 39];
  s += `<defs><pattern id="hatch-${id}" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.6" height="5" fill="var(--hatch)"/></pattern></defs>`;
  qStarts.forEach((q, i) => {
    const w = (i === 3 ? 14 : 13) * unit;
    s += `<text x="${q * unit + 4}" y="14" font-size="12" fill="var(--text)" font-weight="600">Q${i + 1}</text><text x="${q * unit + 26}" y="14" font-size="11" fill="var(--text2)">${i === 3 ? 14 : 13} wk</text>`;
  });
  WEEKS.forEach((n, i) => {
    const x = acc * unit, w = n * unit;
    const fill = i % 2 ? "var(--fill-b)" : "var(--fill-a)";
    if (id === "B") {
      for (let k = 0; k < n; k++) {
        const extra = i === 11 && k === n - 1;
        s += `<rect x="${(acc + k) * unit + 0.75}" y="24" width="${unit - 1.5}" height="38" rx="1" fill="${extra ? `url(#hatch-${id})` : fill}" stroke="${extra ? "var(--hatch)" : "none"}"/>`;
      }
    } else {
      s += `<rect x="${x}" y="24" width="${w}" height="38" fill="${fill}"/>`;
      if (i === 11) s += `<rect x="${x + 4 * unit}" y="24" width="${unit}" height="38" fill="url(#hatch-${id})" stroke="var(--hatch)" stroke-width="1"/>`;
      for (let k = 1; k < n; k++) s += `<line x1="${x + k * unit}" x2="${x + k * unit}" y1="56" y2="62" stroke="var(--text2)" stroke-width="1"/>`;
      s += `<line x1="${x}" x2="${x}" y1="24" y2="62" stroke="var(--text2)" stroke-width="1"/>`;
    }
    s += `<text x="${x + w / 2}" y="47" font-size="11" text-anchor="middle" fill="var(--text)">P${i + 1}</text>`;
    acc += n;
  });
  qStarts.slice(1).forEach(q => { s += `<line x1="${q * unit}" x2="${q * unit}" y1="2" y2="70" stroke="var(--text)" stroke-width="2"/>`; });
  if (id === "A") { s += `<line x1="0" x2="${W}" y1="70" y2="70" stroke="var(--text)"/><line x1="0" x2="${W}" y1="73" y2="73" stroke="var(--text)"/>`; }
  else { s += `<line x1="0" x2="${W}" y1="72" y2="72" stroke="var(--text)"/>`; }
  s += `<circle cx="5" cy="72" r="4.5" fill="var(--text)"/><circle cx="${W - 5}" cy="72" r="4" fill="var(--bg)" stroke="${id === "C" ? "var(--accent)" : "var(--text)"}" stroke-width="2"/>`;
  s += `<text x="0" y="92" font-size="12" fill="var(--text)">2023-01-29</text><text x="0" y="107" font-size="11" fill="var(--text2)">start, included</text>`;
  s += `<text x="${W}" y="92" font-size="12" text-anchor="end" fill="var(--text)">2024-02-04</text><text x="${W}" y="107" font-size="11" text-anchor="end" fill="var(--text2)">end_exclusive, excluded</text>`;
  s += `<text x="${W}" y="126" font-size="11" text-anchor="end" fill="var(--text2)">week 53, hatched, falls in P12</text>`;
  return `<svg viewBox="-6 0 ${W + 12} ${H}" role="img" aria-labelledby="ys-${id}-t" style="font-family:var(--sans);font-variant-numeric:tabular-nums"><title id="ys-${id}-t">NRF 4-5-4 fiscal 2023: 371 days, 53 weeks, from 2023-01-29 (included) to 2024-02-04 (excluded); week 53 falls in period 12.</title>${s}</svg>`;
}

const CODE = `<span class="k">from</span> fiscalclock <span class="k">import</span> FiscalCalendar

cal = FiscalCalendar(definition)        <span class="c"># your JSON definition</span>
here = cal.locate(<span class="k">"2024-02-03"</span>)
cal.format(here.quarter)                 <span class="c"># "Q4 FY2023"</span>`;

function render(theme) {
  const root = document.getElementById("dirs"); root.innerHTML = "";
  DIRS.forEach(d => {
    const L = vars(d.id, "light"), D = vars(d.id, "dark"), T = theme === "dark" ? D : L;
    const sw = (list) => list.map(([n, h]) => `<div class="swatch" style="background:${h};color:${contrastInk(h)}"><b>${n}</b><span>${h}</span></div>`).join("");
    const lock = (c, size = 40) => `<div class="lockup">${mark(d.id, size, c.text, c.accent)}<span class="wordmark" style="color:${c.text}">fiscalclock</span></div>`;
    const sizes = (c) => `<div class="sizes">${[64, 32].map(z => `<figure>${mark(d.id, z, c.text, c.accent)}<figcaption>${z} px</figcaption></figure>`).join("")}<figure>${mark(d.id, 16, c.text, c.accent, true)}<figcaption>16 px</figcaption></figure><figure>${mark(d.id, 32, c.text, c.text)}<figcaption>one colour</figcaption></figure></div>`;
    const sec = document.createElement("section"); sec.className = "dir";
    sec.innerHTML = `
      <div class="dirhead"><h2>${d.name}</h2><p class="concept">${d.concept}</p></div>
      <div class="grid">
        <div class="card span-7"><h3>Logo concept: lockup, symbol sizes, one colour</h3>
          <div class="logos"><div class="themed ${d.id} light">${lock(L)}${sizes(L)}</div><div class="themed ${d.id} dark">${lock(D)}${sizes(D)}</div></div></div>
        <div class="card span-5"><h3>Palette (${theme}) and WCAG 2.2 contrast</h3>
          <div class="swatches">${sw(d.palette[theme])}</div>
          <table class="ratios"><thead><tr><th>Pair</th><th>Light</th><th>Dark</th></tr></thead><tbody>${d.ratios.map(r => `<tr><td>${r[0]}</td><td class="num">${r[1]}:1</td><td class="num">${r[2]}:1</td></tr>`).join("")}</tbody></table></div>
        <div class="card span-6 themed ${d.id} ${theme}"><h3>Typography</h3>
          <div class="type">
            <p class="h">Every period has a start and an end_exclusive.</p>
            <p>You describe the calendar as data. fiscalclock tells you which fiscal year, quarter, period and week a date is in, and the exact bounds of each, in Rust, Python and JavaScript.</p>
            <div class="datecol"><span>FY2023</span><span>2023-01-29</span><span>53 weeks</span><span>Q4 FY2023</span><span>2023-10-29</span><span>14 weeks</span><span>P12</span><span>2023-12-31</span><span>5 weeks</span><span>W53</span><span>2024-01-28</span><span>1 week</span></div>
            <p><code>cal.locate("2024-02-03")</code></p>
          </div></div>
        <div class="card span-6 themed ${d.id} ${theme}"><h3>README header</h3>
          <div class="readme">${lock(T)}
            <p class="desc">Fiscal calendar engine: compute any fiscal calendar from a JSON definition.</p>
            <div class="badges"><span class="badge"><span>CI</span><span>passing</span></span><span class="badge"><span>crates.io</span><span>v0.1.0</span></span><span class="badge"><span>PyPI</span><span>v0.1.0</span></span><span class="badge"><span>npm</span><span>v0.1.0</span></span></div>
            <div class="proof"><span><strong>4,070</strong> conformance cases from cited sources</span><span><strong>3</strong> languages, byte-identical JSON</span><span><strong>0</strong> built-in calendars</span></div>
          </div></div>
        <div class="card span-7 themed ${d.id} ${theme}"><h3>Docs page</h3>
          <div class="docs"><nav><a>Get started</a><a>Definitions</a><a class="on">Locate a date</a><a>Periods</a><a>Labels</a><a>Errors</a></nav>
            <main><h4>Locate a date</h4>
              <p><code class="mono">locate</code> returns the year, quarter, period and week that contain a date. Every period is half-open: <a class="link" href="#">see Semantics</a>.</p>
              <div class="tabs"><span>Rust</span><span class="on">Python</span><span>JavaScript</span></div>
              <pre class="code">${CODE}</pre>
              <table class="res"><thead><tr><th>Level</th><th>Label</th><th>start</th><th>end_exclusive</th><th>Weeks</th></tr></thead>
                <tbody><tr><td>Week</td><td>W53</td><td>2024-01-28</td><td>2024-02-04</td><td>1</td></tr><tr><td>Period</td><td>P12</td><td>2023-12-31</td><td>2024-02-04</td><td>5</td></tr><tr><td>Quarter</td><td>Q4 FY2023</td><td>2023-10-29</td><td>2024-02-04</td><td>14</td></tr><tr class="total"><td>Year</td><td>FY2023</td><td>2023-01-29</td><td>2024-02-04</td><td>53</td></tr></tbody></table>
              <div class="note">Illustrative definition: NRF 4-5-4. fiscalclock has no built-in calendars.</div>
            </main></div></div>
        <div class="card span-5"><h3>Social card (1200 × 630, shown at half size)</h3>
          <div class="socialwrap"><div class="social themed ${d.id} ${theme}"><div class="inner">${lock(T)}
            <p class="tag" style="align-self:center">${d.social}</p>
            <div class="foot">Rust, Python and JavaScript. MIT or Apache-2.0.</div></div></div></div></div>
        <figure class="card span-12 themed ${d.id} ${theme} diagram" style="margin:0"><h3 style="margin:-16px -20px 12px">Diagram style: year strip</h3>${yearStrip(d.id)}
          <figcaption>Widths are proportional to days. Filled marker: included start. Open marker: excluded end.</figcaption></figure>
      </div>
      <div class="verdict"><div><h3>Strengths</h3><ul>${d.pros.map(p => `<li>${p}</li>`).join("")}</ul></div><div><h3>Weaknesses</h3><ul>${d.cons.map(p => `<li>${p}</li>`).join("")}</ul></div></div>`;
    root.appendChild(sec);
  });
}
function contrastInk(hex) {
  const c = hex.replace("#", "").match(/../g).map(x => parseInt(x, 16) / 255).map(v => v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
  const L = 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  return (1.05 / (L + 0.05)) > ((L + 0.05) / 0.05) ? "#fff" : "#000";
}
const buttons = document.querySelectorAll(".switch button");
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  buttons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.set === t)));
  render(t);
}
buttons.forEach(b => b.addEventListener("click", () => setTheme(b.dataset.set)));
const initial = location.hash === "#dark" ? "dark" : "light";
setTheme(initial);
document.fonts.ready.then(() => setTheme(document.documentElement.dataset.theme || initial));
</script>
</body>
</html>
