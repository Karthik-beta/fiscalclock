name: Binding or packaging issue
description: A package fails to install, import or build, or behaves differently on one platform.
title: "Packaging: "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - Rust crate (crates.io)
        - Python package (PyPI)
        - npm package
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: fiscalclock version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and CPU architecture
      placeholder: "Ubuntu 24.04, x86_64"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and tool versions
      description: Rust and Cargo, Python and pip or uv, or Node.js and npm, plus any bundler.
      placeholder: "Python 3.14 (free-threaded), uv 0.12"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or code
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full error output
      render: text
    validations:
      required: true
