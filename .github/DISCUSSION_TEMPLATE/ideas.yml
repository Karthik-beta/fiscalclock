title: "Idea: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How fiscalclock could help. Rough sketches are welcome.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Real-world examples
      description: Organisations or calendars that need this, with links where you have them.
