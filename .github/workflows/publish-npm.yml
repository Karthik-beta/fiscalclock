name: publish-npm

# Publishes the npm tarball that a release run already built and attested,
# for when that run's own npm publish job failed. The tarball is published
# unchanged after its build provenance is verified.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of the release workflow run whose npm tarball to publish
        required: true
      tag:
        description: The version tag that run built, for example v0.1.0
        required: true

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/fiscalclock
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: npm-dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: The tarball was built by release.yml from the tag
        run: >-
          gh attestation verify npm-dist/fiscalclock-*.tgz
          --repo "$GITHUB_REPOSITORY"
          --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          --source-ref "refs/tags/$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Publish to npm with provenance
        run: npm publish ./npm-dist/fiscalclock-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
