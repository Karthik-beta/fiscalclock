name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  MATURIN_VERSION: "1.15.0"
  MSRV: "1.85"

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --release -p fiscalclock --locked
      - name: JSON API tests with overflow checks
        run: cargo test -p fiscalclock --locked --test json_api
      - name: Documentation builds without warnings
        run: cargo doc --no-deps -p fiscalclock
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Core builds for WebAssembly
        run: cargo build -p fiscalclock --target wasm32-unknown-unknown --release
      - name: Crate packages
        run: cargo package -p fiscalclock --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcript-rust
          path: target/transcripts/rust.txt
          if-no-files-found: error

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$MSRV" --profile minimal --no-self-update
          rustup default "$MSRV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Core builds and passes conformance on the minimum supported Rust version
        run: |
          cargo check -p fiscalclock --locked
          cargo test --release -p fiscalclock --locked --test conformance

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python: ["3.10", "3.14"]
        include:
          - os: ubuntu-24.04
            python: "3.14t"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the wheel
        run: |
          python -m pip install "maturin==$MATURIN_VERSION"
          features=""
          if [[ "${{ matrix.python }}" == *t ]]; then features="--no-default-features"; fi
          maturin build --release --locked $features --out wheels --manifest-path bindings/python/Cargo.toml --interpreter python
          python -m pip install --no-index --find-links wheels fiscalclock
      - name: Tests
        run: python -m unittest discover -s bindings/python/tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcript-python-${{ matrix.os }}-${{ matrix.python }}
          path: target/transcripts/python.txt
          if-no-files-found: error

  js:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        node: ["22", "26"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install wasm-bindgen-cli at the version in Cargo.lock
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          test -n "$version"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Build
        working-directory: bindings/js
        run: |
          npm ci
          npm run build
      - name: Tests
        working-directory: bindings/js
        run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transcript-js-${{ matrix.os }}-${{ matrix.node }}
          path: target/transcripts/js.txt
          if-no-files-found: error

  identical-output:
    needs: [rust, python, js]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: transcript-*
          path: transcripts
      - name: Every binding on every platform returns the Rust core's JSON byte for byte
        run: |
          reference=transcripts/transcript-rust/rust.txt
          test -s "$reference"
          count=0
          for f in transcripts/transcript-*/*.txt; do
            cmp "$reference" "$f"
            count=$((count + 1))
          done
          echo "$count transcripts identical, $(wc -l < "$reference") cases each"
          test "$count" -eq 14

  consistency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Licence copies in the packages match the repository's
        run: |
          for pkg in crates/core bindings/python bindings/js; do
            cmp LICENSE-MIT "$pkg/LICENSE-MIT"
            cmp LICENSE-APACHE "$pkg/LICENSE-APACHE"
          done
      - name: Every package has the same version
        run: python3 -I scripts/check_versions.py

  # One stable name for a ruleset to require. A skipped job counts as passing
  # for a required check, so requiring identical-output alone would let a
  # failed python or js job through.
  ci-passed:
    if: always()
    needs: [rust, msrv, python, js, identical-output, consistency]
    runs-on: ubuntu-24.04
    steps:
      - name: Every ci job passed
        run: |
          for result in $RESULTS; do
            test "$result" = success
          done
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
