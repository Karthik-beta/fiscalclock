# cspell:words postinstall Vercel
name: website

# The paths match the ones website/scripts/should-build.sh checks before a
# Vercel build, plus this workflow and the link-checker config;
# website/tests/build-inputs.spec.ts fails when they differ.
on:
  pull_request:
    paths: &site-inputs
      - "website/**"
      - "design/tokens/generated/**"
      - "assets/brand/**"
      - "spec/definition-v1.md"
      - "spec/api-v1.md"
      - "CHANGELOG.md"
      - "conformance/vectors/**"
      - "docs/examples/**"
      - "lychee.toml"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths: *site-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # The executable examples in the guides run in Python and Rust as well as JavaScript.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install
        # @ibm/plex-sans and @ibm/plex-mono declare a telemetry postinstall script.
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Type-check
        run: npm run check
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Tests
        run: npm test -- --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - name: Executable examples
        run: npm run --if-present test:examples
      - name: Internal links in the built site
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config website/lychee.toml --no-progress --root-dir "${{ github.workspace }}/website/dist" "website/dist/**/*.html"
          fail: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            website/playwright-report/
            website/test-results/
          if-no-files-found: ignore
