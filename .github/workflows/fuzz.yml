name: fuzz

# The long fuzzing runs that count toward Gate D's 24 CPU hours (fuzz/README.md).
# Started by hand; each target runs on every core of one runner for `minutes`,
# and the job summary gives the CPU hours to record in fuzz/README.md.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes per target (at most 330, inside the 6-hour job limit)
        required: true
        default: "120"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FUZZ_NIGHTLY: nightly-2026-11-01
  CARGO_FUZZ_VERSION: "0.13.2"

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [validate_json, validate_structured, parse_label]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly Rust and cargo-fuzz
        run: |
          rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal --no-self-update
          cargo +"$FUZZ_NIGHTLY" install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Fuzz on every core
        run: |
          test "$MINUTES" -ge 1 && test "$MINUTES" -le 330
          python3 -I fuzz/seed_corpus.py
          cd fuzz
          cores=$(nproc)
          start=$(date +%s)
          status=0
          cargo +"$FUZZ_NIGHTLY" fuzz run "$TARGET" "corpus/$TARGET" -- \
            -fork="$cores" -max_total_time=$((MINUTES * 60)) -timeout=10 -rss_limit_mb=2048 || status=$?
          seconds=$(( $(date +%s) - start ))
          hours=$(awk -v s="$seconds" -v c="$cores" 'BEGIN { printf "%.2f", s * c / 3600 }')
          {
            echo "| Date | Target | Commit | Cores | Seconds | CPU hours | Result |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "| $(date -u +%F) | $TARGET | $GITHUB_SHA | $cores | $seconds | $hours | exit $status |" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          MINUTES: ${{ inputs.minutes }}
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/artifacts/
            fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore
