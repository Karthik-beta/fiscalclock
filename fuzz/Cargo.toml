[package]
name = "fiscalclock-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
fiscalclock = { path = "../crates/core" }
libfuzzer-sys = "=0.4.13"
serde_json = "1"

# Not a member of the repository's workspace: it builds only with nightly Rust
# and cargo-fuzz (fuzz/README.md), and the core's dependencies stay unchanged.
[workspace]
members = ["."]

[[bin]]
name = "validate_json"
path = "fuzz_targets/validate_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate_structured"
path = "fuzz_targets/validate_structured.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_label"
path = "fuzz_targets/parse_label.rs"
test = false
doc = false
bench = false
